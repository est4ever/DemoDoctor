<title id="title">DemoDoctor evidence pipeline</title><desc id="desc">Robot footage feeds SAM and selected source images feed Muse. Source-backed checks support task criteria. Validated cited explanations and scoped criteria reach the investigation UI. Optional recorded robot joints supply measured signals, not invented measurements.</desc>
